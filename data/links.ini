# Adresses affichées par l'application.
#
# Une par ligne, au format « clé = adresse ». Les lignes vides et celles
# commençant par un dièse sont ignorées.
#
# Ce fichier est lu par CMake lors de la configuration, et les adresses sont
# inscrites dans un en-tête généré : voir CMakeLists.txt et src/Links.h.in.
# Il n'est pas installé auprès de l'application ; son contenu est compilé
# dans le binaire, comme l'est le numéro de version. Modifier une adresse
# impose donc de reconfigurer le projet.
#
# Si une clé demandée par CMake est absente, la configuration échoue. Ce
# comportement est voulu : une adresse manquante ferait disparaître le lien
# de la fenêtre des réglages sans message d'erreur.

# Éditeur permettant de créer un jeu de cartes. Affiché dans les réglages,
# sur les pages « Les cartes » et « Les dos ».
editeur-de-cartes = https://github.com/pdulvp/pdcartes-barquette
